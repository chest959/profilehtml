<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ยินดีต้อนรับสู่เว็บไซต์ของฉัน</h1>
        <p>โปรเจกต์นี้โฮสต์อยู่บน GitHub Pages อย่างปลอดภัย</p>
    </header>

    <main>
        <section class="card">
            <h2>เกี่ยวกับโปรเจกต์</h2>
            <p>นี่คือหน้าเว็บเริ่มต้นที่สร้างขึ้นด้วย HTML และ CSS โดยมีการดึงรูปภาพตัวอย่างมาแสดงผลผ่านโค้ด</p>
            <div class="image-container">
                <img src="img.jpg" alt="รูปภาพประกอบเว็บไซต์" class="responsive-img">
            </div>
            <p class="caption">รูปภาพประกอบสไตล์มินิมอล</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 สร้างด้วยความรักบน GitHub</p>
    </footer>
</body>
</html>
